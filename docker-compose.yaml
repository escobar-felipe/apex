
services:
    redis:
      image: bitnami/redis:latest
      container_name: redis
      expose:
        - "6379"
      environment:
        - ALLOW_EMPTY_PASSWORD=yes
      networks:
        - net-host

    apex:
      build:
          context: ./apex
          dockerfile: Dockerfile
      env_file:
        - path: .env
          required: false
      command: gunicorn --bind 0.0.0.0:5000 wsgi:app
      container_name: apex
      ports:
        - 5000:5000
      depends_on:
        - redis
      networks:
        - net-host
    
    celery:
      build:
          context: ./apex
          dockerfile: Dockerfile
      env_file:
        - path: .env
          required: false
      command: celery -A wsgi:celery worker -l INFO
      depends_on:
        - redis
      networks:
        - net-host

networks:
  net-host:
    driver: bridge
