
services:
    postgres:
      image: postgres:16-alpine
      container_name: apex-postgres
      profiles:
        - local-db
      environment:
        POSTGRES_DB: ${POSTGRES_DB:-apex_development}
        POSTGRES_USER: ${POSTGRES_USER:-apex}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apex_dev_password}
      ports:
        - "${POSTGRES_PORT:-5432}:5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apex} -d ${POSTGRES_DB:-apex_development}"]
        interval: 5s
        timeout: 5s
        retries: 10
      networks:
        - net-host

    redis:
      image: bitnami/redis:latest
      container_name: redis
      expose:
        - "6379"
      environment:
        - ALLOW_EMPTY_PASSWORD=yes
      networks:
        - net-host

    apex:
      build:
          context: ./apex
          dockerfile: Dockerfile
      env_file:
        - path: .env
          required: false
      environment:
        ENVIRONMENT: ${ENVIRONMENT:-development}
        BASE_URL: ${BASE_URL:-/}
        ROOT_DOMAIN: ${ROOT_DOMAIN:-}
        DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-default}
        SECRET_SESSION: ${SECRET_SESSION:-dev-secret-session-change-me}
        BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
        BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
        REDIS_HOST: ${REDIS_HOST:-redis://redis:6379}
        DATABASE_URL: ${DATABASE_URL:-postgresql://apex:apex_dev_password@postgres:5432/apex_development}
        LIMIT: ${LIMIT:-1500}
      command: gunicorn --bind 0.0.0.0:5000 wsgi:app
      container_name: apex
      ports:
        - 5000:5000
      depends_on:
        redis:
          condition: service_started
      volumes:
        - apex-data:/app/data
      networks:
        - net-host
    
    celery:
      build:
          context: ./apex
          dockerfile: Dockerfile
      env_file:
        - path: .env
          required: false
      environment:
        ENVIRONMENT: ${ENVIRONMENT:-development}
        BASE_URL: ${BASE_URL:-/}
        ROOT_DOMAIN: ${ROOT_DOMAIN:-}
        DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-default}
        SECRET_SESSION: ${SECRET_SESSION:-dev-secret-session-change-me}
        BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
        BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
        REDIS_HOST: ${REDIS_HOST:-redis://redis:6379}
        DATABASE_URL: ${DATABASE_URL:-postgresql://apex:apex_dev_password@postgres:5432/apex_development}
        LIMIT: ${LIMIT:-1500}
      command: celery -A wsgi:celery worker -l INFO
      depends_on:
        redis:
          condition: service_started
      volumes:
        - apex-data:/app/data
      networks:
        - net-host

networks:
  net-host:
    driver: bridge

volumes:
  apex-data:
  postgres-data:
